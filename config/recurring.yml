# Recurring tasks run by Solid Queue's scheduler (production only).
# Times are UTC.
production:
  # deletes uploads past their expiration date, if enabled in System settings
  clean_up_expired_uploads:
    class: ExpiredUploadsCleanUpJob
    queue: default
    schedule: every day at 4am

  # Solid Queue housekeeping: drop finished jobs older than
  # config.solid_queue.clear_finished_jobs_after
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
